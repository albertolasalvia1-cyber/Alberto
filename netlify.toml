# Sito statico: nessuna build necessaria, si pubblica la cartella così com'è.
[build]
  publish = "."

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/menu/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
